<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — Multi-Vendor Marketplace</title>
<meta name="description" content="NEXUS — production-grade multi-vendor marketplace. Storefront, vendor dashboard, and admin control center.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.0"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b10; --bg2:#0f1118; --panel:#14161f; --panel2:#1a1d28; --line:#252938;
  --txt:#eef1f8; --mut:#8b93a7; --pri:#6d5efc; --pri2:#8b7dff; --acc:#00e5a0;
  --warn:#ffb020; --bad:#ff4d6a; --ok:#00d68f;
  --r:14px; --sh:0 10px 40px rgba(0,0,0,.5);
}
[data-theme="light"]{
  --bg:#f6f7fb; --bg2:#ffffff; --panel:#ffffff; --panel2:#f2f4f9; --line:#e3e7f0;
  --txt:#0d1020; --mut:#5f6880; --sh:0 8px 30px rgba(20,30,60,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); font-family:Inter,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
h1,h2,h3,h4,.font-d{font-family:Sora,Inter,sans-serif;letter-spacing:-.02em}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--mut)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit}
input,select,textarea{
  background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:11px 13px;width:100%;outline:none;transition:.16s;
}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(109,94,252,.15)}
input::placeholder,textarea::placeholder{color:var(--mut)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:10px;border:1px solid transparent;cursor:pointer;
  font-weight:600;font-size:14px;transition:.16s;white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn-p{background:linear-gradient(135deg,var(--pri),#5a4ae8);color:#fff;box-shadow:0 6px 20px rgba(109,94,252,.35)}
.btn-p:hover{filter:brightness(1.12)}
.btn-g{background:var(--panel2);color:var(--txt);border-color:var(--line)}
.btn-g:hover{border-color:var(--mut)}
.btn-d{background:rgba(255,77,106,.12);color:var(--bad);border-color:rgba(255,77,106,.3)}
.btn-d:hover{background:rgba(255,77,106,.2)}
.btn-ok{background:rgba(0,214,143,.12);color:var(--ok);border-color:rgba(0,214,143,.3)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn-xs{padding:5px 9px;font-size:12px;border-radius:7px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel2)}
.chip-ok{background:rgba(0,214,143,.12);color:var(--ok);border-color:rgba(0,214,143,.25)}
.chip-warn{background:rgba(255,176,32,.12);color:var(--warn);border-color:rgba(255,176,32,.25)}
.chip-bad{background:rgba(255,77,106,.12);color:var(--bad);border-color:rgba(255,77,106,.25)}
.chip-pri{background:rgba(109,94,252,.14);color:var(--pri2);border-color:rgba(109,94,252,.3)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;padding:12px 14px;color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line)}
.tbl tbody tr:hover{background:var(--panel2)}
.tbl tbody tr:last-child td{border-bottom:none}
.skel{background:linear-gradient(90deg,var(--panel2) 25%,var(--line) 50%,var(--panel2) 75%);background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.fade-in{animation:fi .35s cubic-bezier(.22,1,.36,1)}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal-bg{position:fixed;inset:0;background:rgba(5,6,12,.75);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fi .2s}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);width:100%;max-width:560px;max-height:90vh;overflow:auto;animation:pop .25s cubic-bezier(.22,1,.36,1)}
.toast-wrap{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--pri);border-radius:12px;padding:14px 18px;box-shadow:var(--sh);min-width:280px;animation:slide .3s cubic-bezier(.22,1,.36,1);font-size:14px}
@keyframes slide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.nav-link{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:10px;color:var(--mut);font-weight:500;font-size:14px;cursor:pointer;transition:.16s;border:1px solid transparent}
.nav-link:hover{background:var(--panel2);color:var(--txt)}
.nav-link.on{background:linear-gradient(135deg,rgba(109,94,252,.16),rgba(109,94,252,.06));color:var(--txt);border-color:rgba(109,94,252,.28);font-weight:600}
.nav-link.on .ico{color:var(--pri2)}
.grid-prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.22s;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-5px);border-color:rgba(109,94,252,.45);box-shadow:0 18px 45px rgba(0,0,0,.45)}
.pcard-img{aspect-ratio:1;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:64px;position:relative;overflow:hidden}
.stars{color:var(--warn);letter-spacing:1px;font-size:13px}
.badge-sale{position:absolute;top:10px;left:10px;background:var(--bad);color:#fff;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;z-index:2}
.badge-new{position:absolute;top:10px;right:10px;background:var(--acc);color:#04120c;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;z-index:2}
.sidebar{width:250px;background:var(--bg2);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;flex-shrink:0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(109,94,252,.18),transparent 70%)}
.marq{display:flex;gap:48px;animation:marq 32s linear infinite;white-space:nowrap}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.hl{background:linear-gradient(120deg,var(--pri2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.switch{position:relative;width:44px;height:24px;background:var(--line);border-radius:99px;cursor:pointer;transition:.2s;flex-shrink:0}
.switch.on{background:var(--pri)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on::after{left:23px}
.sidebar::-webkit-scrollbar{width:5px}
@media(max-width:900px){
  .sidebar{position:fixed;z-index:150;transform:translateX(-100%);transition:.25s}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.7)}
}

/* ============ ARABIC PUBLIC STORE THEME ============ */
body.public-theme {
  --bg:#faf6ee; --bg2:#ffffff; --panel:#ffffff; --panel2:#f3ede2; --line:rgba(31,43,30,.10);
  --txt:#0f1410; --mut:#6b6b6b; --pri:#c9a961; --pri2:#a98a45; --acc:#278e43;
  --bad:#ed2024; --ok:#278e43; --warn:#d97642;
  background:#faf6ee; color:#0f1410; font-family:Cairo,Inter,sans-serif; direction:rtl;
}
html[dir="ltr"] body.public-theme { direction:ltr; }
html[dir="ltr"] body.public-theme .arabic-logo, html[dir="ltr"] body.public-theme .arabic-header-inner, html[dir="ltr"] body.public-theme .arabic-nav-inner { direction:ltr; }
.language-switcher { border:1px solid rgba(31,43,30,.12); background:#fff; color:#1f2b1e; border-radius:100px; padding:8px 12px; min-width:92px; width:auto; font-size:12px; cursor:pointer; }
body:not(.public-theme) .language-switcher { background:var(--panel2); color:var(--txt); border-color:var(--line); }
body.public-theme h1, body.public-theme h2, body.public-theme h3, body.public-theme h4 { font-family:Cairo,Inter,sans-serif; }
body.public-theme .card { border-color:rgba(31,43,30,.09); box-shadow:0 9px 30px rgba(31,43,30,.07); }
body.public-theme .btn-p { background:linear-gradient(135deg,#f4c95d,#c9a961); color:#1f2b1e; box-shadow:0 10px 25px rgba(201,169,97,.28); }
body.public-theme .btn-g { background:#fff; color:#1f2b1e; border-color:rgba(31,43,30,.13); }
body.public-theme .btn-g:hover { border-color:#c9a961; color:#a98a45; }
body.public-theme input, body.public-theme select, body.public-theme textarea { background:#fff; color:#0f1410; border-color:rgba(31,43,30,.13); }
body.public-theme .pcard { background:#fff; border-color:rgba(31,43,30,.08); border-radius:18px; box-shadow:0 8px 24px rgba(31,43,30,.06); }
body.public-theme .pcard:hover { border-color:rgba(201,169,97,.6); box-shadow:0 22px 44px rgba(31,43,30,.14); }
body.public-theme .pcard-img { background:#f0ebe0; }
body.public-theme .pcard-img > div { filter:saturate(.9); }
body.public-theme .stars { color:#c9a961; }
body.public-theme .chip-pri { color:#8d7134; background:rgba(201,169,97,.14); border-color:rgba(201,169,97,.32); }
body.public-theme .chip-ok { color:#237b3b; background:rgba(39,142,67,.10); border-color:rgba(39,142,67,.22); }
body.public-theme .modal-bg { background:rgba(15,20,16,.58); }

.arabic-public-header { background:rgba(255,255,255,.88); backdrop-filter:blur(22px); border-bottom:1px solid rgba(31,43,30,.09); position:sticky; top:0; z-index:100; }
.arabic-topbar { background:linear-gradient(90deg,#1f2b1e,#3d5637); color:#e8d5a1; padding:8px 20px; font-size:12px; text-align:center; position:relative; overflow:hidden; }
.arabic-topbar::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(254,189,17,.16),transparent); transform:translateX(-100%); animation:publicShimmer 5s infinite; }
@keyframes publicShimmer { to { transform:translateX(100%); } }
.arabic-topbar span { position:relative; z-index:1; }
.mini-flag { display:inline-block; width:18px; height:12px; border-radius:2px; margin-left:8px; vertical-align:-1px; background:linear-gradient(#ed2024 0 33%,#fff 33% 66%,#278e43 66%); position:relative; }
.mini-flag::after { content:"☀"; position:absolute; inset:0; display:grid; place-items:center; color:#febd11; font-size:8px; }
.arabic-header-inner { max-width:1560px; padding:14px 24px; margin:0 auto; display:grid; grid-template-columns:auto minmax(280px,680px) auto; gap:36px; align-items:center; }
.arabic-logo { display:flex; align-items:center; gap:10px; direction:rtl; cursor:pointer; }
.arabic-logo-mark { width:48px; height:48px; border-radius:14px; background:linear-gradient(135deg,#1f2b1e,#4a6741); display:grid; place-items:center; color:#f4c95d; font-size:25px; box-shadow:0 8px 18px rgba(31,43,30,.15); }
.arabic-logo-copy { display:flex; flex-direction:column; line-height:1; }
.arabic-logo-copy strong { font-family:'Playfair Display',serif; font-size:19px; letter-spacing:2px; color:#1f2b1e; }
.arabic-logo-copy small { color:#c9a961; letter-spacing:2px; font-weight:700; font-size:9px; margin-top:6px; }
.arabic-search { position:relative; width:100%; }
.arabic-search input { height:47px; border-radius:100px; padding:10px 50px 10px 20px; background:#faf6ee; }
.arabic-search span { position:absolute; right:18px; top:50%; transform:translateY(-50%); color:#6b6b6b; display:flex; }
.arabic-actions { display:flex; align-items:center; gap:5px; }
.arabic-icon-btn { width:43px; height:43px; border-radius:50%; display:grid; place-items:center; color:#1f2b1e; position:relative; transition:.25s; }
.arabic-icon-btn:hover { background:#f0ebe0; color:#a98a45; transform:translateY(-2px); }
.arabic-icon-btn .count { position:absolute; top:0; right:0; min-width:17px; height:17px; border-radius:99px; background:#ed2024; color:#fff; font-size:10px; display:grid; place-items:center; font-weight:800; }
.arabic-account { display:inline-flex; gap:7px; align-items:center; padding:10px 15px; border-radius:100px; background:#1f2b1e; color:#fff; font-size:12px; font-weight:700; }
.arabic-nav { border-top:1px solid rgba(31,43,30,.07); background:rgba(255,255,255,.6); }
.arabic-nav-inner { max-width:1560px; margin:0 auto; padding:0 24px; height:48px; display:flex; gap:5px; align-items:center; overflow:auto; scrollbar-width:none; }
.arabic-nav-inner::-webkit-scrollbar { display:none; }
.arabic-nav-link { padding:7px 15px; border-radius:100px; color:#1f2b1e; font-size:13px; white-space:nowrap; transition:.2s; }
.arabic-nav-link:hover, .arabic-nav-link.active { background:#f0ebe0; color:#a98a45; }
.arabic-nav-link.promo { color:#ed2024; font-weight:800; }
.arabic-mobile-menu { display:none; }

.arabic-hero { min-height:650px; position:relative; overflow:hidden; isolation:isolate; color:#fff; background:linear-gradient(135deg,#0f1410,#1f2b1e 52%,#3d5637); }
.arabic-hero::before { content:""; position:absolute; inset:0; z-index:-3; background-image:linear-gradient(90deg,rgba(15,20,16,.96) 10%,rgba(31,43,30,.78) 55%,rgba(31,43,30,.3)),url('https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2200&q=82'); background-size:cover; background-position:center; filter:saturate(.82); }
.arabic-hero::after { content:""; position:absolute; inset:0; z-index:-2; background:radial-gradient(circle at 70% 20%,rgba(254,189,17,.20),transparent 26%),radial-gradient(circle at 15% 85%,rgba(217,118,66,.18),transparent 30%); }
.arabic-hero-inner { max-width:1560px; min-height:650px; margin:0 auto; padding:90px 24px; display:grid; grid-template-columns:1.1fr .9fr; align-items:center; gap:70px; }
.arabic-hero-copy { max-width:720px; }
.arabic-eyebrow { display:inline-flex; gap:9px; align-items:center; padding:7px 15px 7px 8px; color:#f4c95d; background:rgba(254,189,17,.10); border:1px solid rgba(254,189,17,.3); border-radius:100px; font-size:12px; margin-bottom:25px; }
.arabic-eyebrow b { width:23px; height:23px; border-radius:50%; background:#febd11; color:#1f2b1e; display:grid; place-items:center; font-size:12px; }
.arabic-hero-title { font-family:'Playfair Display',Cairo,serif !important; font-size:clamp(42px,6.6vw,88px); line-height:1.06; letter-spacing:-1px; margin:0 0 13px; }
.arabic-hero-title span { display:block; background:linear-gradient(135deg,#fff,#e8d5a1); background-clip:text; -webkit-background-clip:text; color:transparent; }
.arabic-hero-title .gold { background:linear-gradient(135deg,#f4c95d,#c9a961,#f4c95d); background-clip:text; -webkit-background-clip:text; color:transparent; filter:drop-shadow(0 4px 20px rgba(244,201,93,.32)); }
.arabic-hero-sub { color:#e8d5a1; font-size:clamp(19px,2.5vw,28px); font-weight:800; margin-bottom:12px; }
.arabic-hero-desc { color:rgba(255,255,255,.75); font-size:15px; line-height:1.9; max-width:560px; margin-bottom:28px; }
.arabic-hero-actions { display:flex; gap:12px; flex-wrap:wrap; }
.arabic-hero-primary { background:linear-gradient(135deg,#f4c95d,#c9a961); color:#1f2b1e; padding:15px 27px; border-radius:100px; font-weight:800; box-shadow:0 15px 34px rgba(244,201,93,.27); }
.arabic-hero-ghost { background:rgba(255,255,255,.07); color:#fff; padding:15px 27px; border-radius:100px; font-weight:700; border:1px solid rgba(255,255,255,.25); }
.arabic-hero-stats { display:flex; gap:34px; margin-top:38px; padding-top:21px; border-top:1px solid rgba(255,255,255,.16); }
.arabic-hero-stat strong { display:block; font-family:'Playfair Display',serif; font-size:27px; color:#f4c95d; }
.arabic-hero-stat small { color:rgba(255,255,255,.56); font-size:11px; }
.arabic-hero-art { position:relative; min-height:420px; display:grid; place-items:center; }
.arabic-hero-art::before,.arabic-hero-art::after { content:""; position:absolute; border:1px solid rgba(244,201,93,.35); border-radius:50%; width:370px; height:370px; }
.arabic-hero-art::after { width:490px; height:490px; border-color:rgba(244,201,93,.14); }
.arabic-hero-mark { width:270px; height:270px; border-radius:50%; display:grid; place-items:center; font-size:155px; color:#f4c95d; background:radial-gradient(circle,rgba(254,189,17,.2),rgba(254,189,17,.03) 58%,transparent 60%); filter:drop-shadow(0 18px 40px rgba(0,0,0,.28)); animation:arabicFloat 5s ease-in-out infinite; }
@keyframes arabicFloat { 50% { transform:translateY(-12px) rotate(2deg); } }

.arabic-section { padding:82px 0; background:#faf6ee; }
.arabic-container { max-width:1320px; padding:0 24px; margin:0 auto; }
.arabic-section-head { display:flex; justify-content:space-between; align-items:end; gap:18px; margin-bottom:27px; }
.arabic-section-tag { color:#a98a45; font-size:12px; font-weight:800; letter-spacing:2px; }
.arabic-section-title { color:#1f2b1e; font-size:clamp(26px,3.3vw,43px); font-weight:900; margin:5px 0 0; line-height:1.2; }
.arabic-section-title span { color:#c9a961; }
.arabic-section-desc { color:#6b6b6b; font-size:14px; margin-top:7px; }
.arabic-link { color:#a98a45; font-weight:700; font-size:13px; white-space:nowrap; }
.arabic-category-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:15px; }
.arabic-category { min-height:158px; padding:22px; border-radius:20px; background:#fff; border:1px solid rgba(31,43,30,.08); box-shadow:0 6px 20px rgba(31,43,30,.05); position:relative; overflow:hidden; text-align:right; transition:.3s; }
.arabic-category:hover { transform:translateY(-6px); border-color:rgba(201,169,97,.5); box-shadow:0 17px 35px rgba(31,43,30,.11); }
.arabic-category::after { content:""; position:absolute; width:90px; height:90px; border-radius:50%; left:-25px; bottom:-25px; background:var(--cat,#f0ebe0); opacity:.8; }
.arabic-category .emoji { font-size:36px; position:relative; z-index:1; }
.arabic-category strong { display:block; color:#1f2b1e; margin-top:13px; font-size:14px; position:relative; z-index:1; }
.arabic-category small { color:#8c8c8c; font-size:11px; position:relative; z-index:1; }
.arabic-products { background:#fff; }
.arabic-products .grid-prod { grid-template-columns:repeat(4,1fr); }
.arabic-products .pcard-img { aspect-ratio:1.05; background-size:cover; background-position:center; }
.arabic-products .pcard-img::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(31,43,30,.02),rgba(31,43,30,.12)); }
.arabic-products .pcard-img > div { position:relative; z-index:1; }
.arabic-products .pcard { border-radius:20px; }

.arabic-story { background:#1f2b1e; color:#fff; overflow:hidden; }
.arabic-story-inner { max-width:1560px; margin:0 auto; min-height:560px; display:grid; grid-template-columns:1fr 1.1fr; align-items:stretch; }
.arabic-story-media { min-height:560px; background-image:linear-gradient(90deg,rgba(31,43,30,.2),rgba(31,43,30,.88)),url('https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1300&q=82'); background-size:cover; background-position:center; position:relative; }
.arabic-story-media span { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:82px; height:82px; border-radius:50%; display:grid; place-items:center; background:#febd11; color:#1f2b1e; font-size:26px; box-shadow:0 0 0 20px rgba(254,189,17,.12); }
.arabic-story-copy { padding:76px 68px; }

function buildOrders(products) {
  const orders = [];
  const rnd = mulberry32(20240617);
  for (let i = 0; i < 68; i++) {
    const cust = DEMO_CUSTOMERS[2 + Math.floor(rnd() * (DEMO_CUSTOMERS.length - 2))];
    const nItems = 1 + Math.floor(rnd() * 3);
    const items = [];
    let subtotal = 0;
    for (let k = 0; k < nItems; k++) {
      const p = products[Math.floor(rnd() * products.length)];
      if (items.find((x) => x.productId === p.id)) continue;
      const qty = 1 + Math.floor(rnd() * 2);
      subtotal += p.price * qty;
      items.push({ productId: p.id, name: p.name, emoji: p.emoji, price: p.price, qty, vendorId: p.vendorId, sku: p.sku });
    }
    const shipping = subtotal > 500 ? 0 : 14.99;
    const tax = +(subtotal * 0.0825).toFixed(2);
    const daysAgo = Math.floor(rnd() * 120);
    const createdAt = new Date(Date.now() - daysAgo * 864e5 - Math.floor(rnd() * 86400)).toISOString();
    let status;
    if (daysAgo < 2) status = rnd() > 0.4 ? "pending" : "processing";
    else if (daysAgo < 6) status = rnd() > 0.5 ? "processing" : "shipped";
    else if (daysAgo < 20) status = rnd() > 0.25 ? "delivered" : "shipped";
    else status = rnd() > 0.12 ? "delivered" : rnd() > 0.5 ? "refunded" : "cancelled";
    orders.push({
      id: "NX-" + (102400 + i * 7),
      customerId: cust.id, customerName: cust.name, customerEmail: cust.email,
      items, subtotal: +subtotal.toFixed(2), shipping, tax,
      total: +(subtotal + shipping + tax).toFixed(2),
      status, paymentStatus: ["cancelled", "refunded"].includes(status) ? status : "paid",
      createdAt,
      address: cust.address || "—",
      tracking: ["shipped", "delivered"].includes(status) ? "1Z" + String(Math.floor(rnd() * 1e9)).padStart(9, "0") : null,
      carrier: ["shipped", "delivered"].includes(status) ? ["UPS", "FedEx", "DHL"][Math.floor(rnd() * 3)] : null,
      timeline: buildTimeline(status, createdAt),
    });
  }
  return orders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
}
function buildTimeline(status, createdAt) {
  const base = new Date(createdAt).getTime();
  const steps = [{ s: "pending", label: "Order placed", at: base }];
  const order = ["pending", "processing", "shipped", "delivered"];
  const idx = order.indexOf(status);
  if (idx > 0) steps.push({ s: "processing", label: "Payment confirmed", at: base + 36e5 });
  if (idx > 1 || status === "cancelled") steps.push({ s: "shipped", label: status === "cancelled" ? "Order cancelled" : "Shipped", at: base + 864e5 });
  if (idx > 2) steps.push({ s: "delivered", label: "Delivered", at: base + 3 * 864e5 });
  if (status === "refunded") steps.push({ s: "refunded", label: "Refund issued", at: base + 5 * 864e5 });
  return steps;
}
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function kurmanjiValue(value) {
  if (KU_TEXT[value]) return KU_TEXT[value];
  let match = value.match(/^(\d+) products · Shop now →$/);
  if (match) return `${match[1]} berhem · Niha bikire →`;
  match = value.match(/^(\d+) products from verified sellers$/);
  if (match) return `${match[1]} berhem ji firoşkarên bawerbar`;
  match = value.match(/^SAVE (\d+)%$/);
  if (match) return `Xilasîna ${match[1]}%`;
  match = value.match(/^(\d+)% off$/);
  if (match) return `${match[1]}% daxistin`;
  match = value.match(/^([\d,]+) reviews$/);
  if (match) return `${match[1]} nirxandin`;
  match = value.match(/^(\d+) items? from (\d+) seller\(s\)$/);
  if (match) return `${match[1]} berhem ji ${match[2]} firoşkaran`;
  match = value.match(/^✦ ([\d.]+)k\+ sellers$/);
  if (match) return `✦ ${match[1]}k+ firoşkar`;
  match = value.match(/^✦ ([\d.]+)m\+ products$/);
  if (match) return `✦ ${match[1]}m+ berhem`;
  match = value.match(/^✦ ([\d.]+)\/5 trust$/);
  if (match) return `✦ ${match[1]} / 5 bawerî`;
  match = value.match(/^of (\d+) registered$/);
  if (match) return `ji ${match[1]} qeydkirî`;
  match = value.match(/^(\d+) pending$/);
  if (match) return `${match[1]} li bendê`;
  if (value.startsWith("Customer: ")) return value.replace("Customer: ", "Xerîdar: ");
  if (value.startsWith("Admin: ")) return value.replace("Admin: ", "Rêveber: ");
  match = value.match(/^Reviews \((\d+)\)$/);
  if (match) return `Nirxandin (${match[1]})`;
  match = value.match(/^Feature (\d+):/);
  if (match) return value.replace(`Feature ${match[1]}:`, `Taybetmendî ${match[1]}:`);
  match = value.match(/^(\d+) in stock$/);
  if (match) return `${match[1]} di stokê de ye`;
  match = value.match(/^★ (.+) · (\d+)% response$/);
  if (match) return `★ ${match[1]} · ${match[2]}% bersiv`;
  if (value === "30-day returns") return "Vegerrandina 30 rojan";
  match = value.match(/^(\d+) seller\(s\)$/);
  if (match) return `${match[1]} firoşkar`;
  const replaced = value.replaceAll("Free shipping", "Şandina belaş").replaceAll("30-day returns", "Vegerrandina 30 rojan").replaceAll("response", "bersiv").replaceAll("Feature", "Taybetmendî").replaceAll("Applied", "Serlêdan").replaceAll("Jan ", "Rêbendan ").replaceAll("Feb ", "Sibat ").replaceAll("Mar ", "Adar ").replaceAll("Apr ", "Nîsan ").replaceAll("May ", "Gulan ").replaceAll("Jun ", "Hezîran ").replaceAll("Jul ", "Tîrmeh ").replaceAll("Aug ", "Gelawêj ").replaceAll("Sep ", "Îlon ").replaceAll("Oct ", "Cotmeh ").replaceAll("Nov ", "Sermawez ").replaceAll("Dec ", "Berfanbar ");
  if (replaced !== value) return replaced;
  return null;
}

const I18n = {
  lang: "ar",
  init() {
    try { this.lang = localStorage.getItem("nexus_language") || Store.db?.settings?.language || "ar"; } catch (e) { this.lang = Store.db?.settings?.language || "ar"; }
    if (!LANGS[this.lang]) this.lang = "ar";
    this.apply();
  },
  set(lang) {
    if (!LANGS[lang]) return;
    this.lang = lang;
    try { localStorage.setItem("nexus_language", lang); } catch (e) {}
    if (Store.db?.settings) { Store.db.settings.language = lang; Store.save(); }
    this.apply();
    if (typeof App !== "undefined" && App.root) App.render();
  },
  apply() {
    document.documentElement.lang = this.lang;
    document.documentElement.dir = LANGS[this.lang].dir;
    const titles = { ar: "NEXUS — سوق متعدد البائعين", en: "NEXUS — Multi-Vendor Marketplace", ku: "NEXUS — Bazara firoşkarên pirjimar" };
    const descriptions = { ar: "NEXUS — سوق متعدد البائعين للمنتجات والعلامات المستقلة.", en: "NEXUS — production-grade multi-vendor marketplace.", ku: "NEXUS — bazarek pîşesazî ji bo berhem û markayên serbixwe." };
    document.title = titles[this.lang];
    const meta = document.querySelector('meta[name="description"]');
    if (meta) meta.content = descriptions[this.lang];
  },
  translateDom(root) {
    if (!root || this.lang === "en") return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((node) => {
      const value = node.nodeValue.trim();
      const direct = this.lang === "ku" ? kurmanjiValue(value) : null;
      const key = DOM_LABEL_KEYS[value];
      if (direct || key) node.nodeValue = node.nodeValue.replace(value, direct || t(key));
    });
    root.querySelectorAll("input,textarea,select,button,[title],[aria-label]").forEach((el) => {
      ["placeholder", "title", "aria-label"].forEach((attr) => {
        const value = el.getAttribute(attr);
        const translated = this.lang === "ku" && value ? kurmanjiValue(value) : null;
        if (translated) el.setAttribute(attr, translated);
      });
    });
  },
};
function t(key) { return TRANSLATIONS[I18n.lang]?.[key] || TRANSLATIONS.en[key] || key; }
function languageSwitcher(className = "") {
  return h("select", { class: "language-switcher " + className, value: I18n.lang, title: "Language", onchange: (e) => I18n.set(e.target.value) }, Object.entries(LANGS).map(([value, info]) => h("option", { value, selected: value === I18n.lang }, info.label)));
}
function localizedCategory(id) { return t(id === "home" ? "homeLiving" : id); }

<script>
/* ============ NEXUS STORE — persistence, state, cart, auth ============ */
const LS_KEY = "nexus_db_v1";
const SS_KEY = "nexus_session_v1";

const Store = {
  db: null,
  listeners: new Set(),
  subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit() { this.listeners.forEach((f) => { try { f(this.db); } catch (e) { console.error(e); } }); },
  save() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.db)); } catch (e) { console.warn("save failed", e); } },
  load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { const d = JSON.parse(raw); if (d && d.version === NX.version) { this.db = d; return; } }
    } catch (e) { console.warn("load failed", e); }
    this.db = this.fresh();
    this.save();
  },
  reset() { this.db = this.fresh(); this.save(); this.emit(); },
  fresh() {
    const products = buildProducts();
    const orders = buildOrders(products);
    const notifications = [
      { id: uid("n"), title: "New order received", body: "Order NX-102400 for $1,249.00", type: "order", read: false, at: new Date(Date.now() - 12 * 6e4).toISOString() },
      { id: uid("n"), title: "Payout processed", body: "$12,480.50 sent to your bank account", type: "payout", read: false, at: new Date(Date.now() - 3 * 36e5).toISOString() },

      { id: uid("n"), title: "Vendor application", body: "Nomad Gear Co submitted an application", type: "vendor", read: false, at: new Date(Date.now() - 40 * 36e5).toISOString() },
    ];
    return {
      version: NX.version,
      products, orders,
      vendors: VENDORS.map((v) => ({ ...v })),
      users: DEMO_CUSTOMERS.map((u) => ({ ...u })),
      payouts: PAYOUTS_SEED.map((p) => ({ ...p })),
      coupons: COUPONS.map((c) => ({ ...c })),
      notifications,
      reviews: [],
      carts: {},
      wishlist: {},
      settings: {
        siteName: "NEXUS", tagline: "The marketplace for everything", currency: "USD", language: "ar",
        commission: 10, theme: "dark", payoutSchedule: "biweekly", minPayout: 100,
        maintenance: false, autoApproveVendors: false, allowGuestCheckout: true,
      },
      broadcasts: [
        "Free shipping on orders over $500",
        "0% commission for your first 30 days as a new vendor",
        "Weekly flash deals — up to 45% off electronics",
        "Join 42,000+ sellers already growing on NEXUS",
      ],
      createdAt: new Date().toISOString(),
    };
  },

  /* ---- getters ---- */
  products(opts = {}) {
    let list = this.db.products.slice();
    if (opts.vendorId) list = list.filter((p) => p.vendorId === opts.vendorId);
    if (opts.category) list = list.filter((p) => p.category === opts.category);
    if (opts.status) list = list.filter((p) => p.status === opts.status);
    if (opts.q) {
      const q = opts.q.toLowerCase();
      list = list.filter((p) => p.name.toLowerCase().includes(q) || p.description.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q));
    }
    return list;
  },
  product(id) { return this.db.products.find((p) => p.id === id); },
  vendor(id) { return this.db.vendors.find((v) => v.id === id); },
  user(id) { return this.db.users.find((u) => u.id === id); },
  order(id) { return this.db.orders.find((o) => o.id === id); },
  ordersForVendor(vid) { return this.db.orders.filter((o) => o.items.some((i) => i.vendorId === vid)); },

  /* ---- CRUD ---- */
  upsertProduct(p) {
    const i = this.db.products.findIndex((x) => x.id === p.id);
    if (i >= 0) this.db.products[i] = { ...this.db.products[i], ...p };
    else this.db.products.unshift({ id: uid("p"), rating: 0, reviewCount: 0, reviews: [], sold: 0, views: 0, createdAt: new Date().toISOString(), status: "active", gallery: [p.emoji || "📦", p.emoji || "📦", p.emoji || "📦"], features: p.features || [], tags: [], freeShipping: (p.price || 0) > 250, ...p });
    this.save(); this.emit();
  },
  deleteProduct(id) { this.db.products = this.db.products.filter((p) => p.id !== id); this.save(); this.emit(); },
  updateOrder(id, patch) {
    const o = this.order(id); if (!o) return;
    Object.assign(o, patch);
    if (patch.status && !o.timeline.find((t) => t.s === patch.status)) {
      o.timeline.push({ s: patch.status, label: STATUS_META[patch.status]?.label || patch.status, at: new Date().toISOString() });
    }
    this.save(); this.emit();
  },
  upsertVendor(v) {
    const i = this.db.vendors.findIndex((x) => x.id === v.id);
    if (i >= 0) this.db.vendors[i] = { ...this.db.vendors[i], ...v };
    else this.db.vendors.push({ id: uid("v"), rating: 0, reviews: 0, joined: new Date().toISOString().slice(0, 10), status: "pending", commission: 10, plan: "starter", verified: false, balance: 0, pending: 0, followers: 0, responseRate: 90, shipOnTime: 90, banner: "linear-gradient(135deg,#6d5efc,#00e5a0)", logo: "🏪", ...v });
    this.save(); this.emit();
  },
  upsertUser(u) {
    const i = this.db.users.findIndex((x) => x.id === u.id);
    if (i >= 0) this.db.users[i] = { ...this.db.users[i], ...u };
    else this.db.users.push({ id: uid("u"), role: "customer", avatar: "🙂", joined: new Date().toISOString().slice(0, 10), status: "active", ...u });
    this.save(); this.emit();
  },
  upsertCoupon(c) {
    const i = this.db.coupons.findIndex((x) => x.code === c.code);
    if (i >= 0) this.db.coupons[i] = { ...this.db.coupons[i], ...c };
    else this.db.coupons.push(c);
    this.save(); this.emit();
  },
  upsertPayout(p) {
    const i = this.db.payouts.findIndex((x) => x.id === p.id);
    if (i >= 0) this.db.payouts[i] = { ...this.db.payouts[i], ...p };
    else this.db.payouts.unshift(p);
    this.save(); this.emit();
  },
  notify(title, body, type = "info") {
    this.db.notifications.unshift({ id: uid("n"), title, body, type, read: false, at: new Date().toISOString() });
    this.db.notifications = this.db.notifications.slice(0, 40);
    this.save(); this.emit();
  },

  /* ---- cart ---- */
  cartKey() { return Session.user ? "u_" + Session.user.id : "guest"; },
  cart() { return this.db.carts[this.cartKey()] || []; },
  cartCount() { return this.cart().reduce((s, i) => s + i.qty, 0); },
  addToCart(productId, qty = 1, variant = null) {
    const k = this.cartKey();
    const cart = this.db.carts[k] || (this.db.carts[k] = []);
    const found = cart.find((i) => i.productId === productId && i.variant === variant);
    const p = this.product(productId);
    if (!p) return false;
    if (found) found.qty = Math.min(found.qty + qty, p.stock);
    else cart.push({ productId, qty: Math.min(qty, p.stock), variant, addedAt: new Date().toISOString() });
    this.save(); this.emit();
    toast(`${p.name.slice(0, 40)}… added to cart`, "ok");
    return true;
  },
  setQty(productId, variant, qty) {
    const cart = this.db.carts[this.cartKey()] || [];
    const it = cart.find((i) => i.productId === productId && i.variant === variant);
    if (it) { it.qty = Math.max(1, qty); this.save(); this.emit(); }
  },
  removeFromCart(productId, variant) {
    const k = this.cartKey();
    this.db.carts[k] = (this.db.carts[k] || []).filter((i) => !(i.productId === productId && i.variant === variant));
    this.save(); this.emit();
  },
  clearCart() { this.db.carts[this.cartKey()] = []; this.save(); this.emit(); },
  cartDetail() {
    const items = this.cart().map((ci) => {
      const p = this.product(ci.productId);
      if (!p) return null;
      return { ...ci, product: p, line: +(p.price * ci.qty).toFixed(2), vendor: this.vendor(p.vendorId) };
    }).filter(Boolean);
    const subtotal = +items.reduce((s, i) => s + i.line, 0).toFixed(2);
    const shipping = subtotal > 500 || subtotal === 0 ? 0 : 14.99;
    const couponCode = this.db._appliedCoupon;
    let discount = 0;
    if (couponCode) {
      const c = this.db.coupons.find((x) => x.code === couponCode && x.active && (!x.min || subtotal >= x.min));
      if (c) discount = c.type === "percent" ? +(subtotal * c.value / 100).toFixed(2) : c.type === "fixed" ? Math.min(c.value, subtotal) : 0;
    }
    const shipFinal = couponCode === "FREESHIP" && subtotal >= 100 ? 0 : shipping;
    const tax = +((subtotal - discount) * 0.0825).toFixed(2);
    return { items, subtotal, shipping: shipFinal, discount, tax, total: +Math.max(0, subtotal - discount + shipFinal + tax).toFixed(2) };
  },
  applyCoupon(code) {
    const c = this.db.coupons.find((x) => x.code.toUpperCase() === code.toUpperCase());
    if (!c) return { ok: false, msg: "Invalid coupon code" };
    if (!c.active) return { ok: false, msg: "This coupon has expired" };
    const sub = this.cartDetail().subtotal;
    if (c.min && sub < c.min) return { ok: false, msg: `Minimum order of ${money(c.min)} required` };
    this.db._appliedCoupon = c.code; this.save(); this.emit();
    return { ok: true, msg: `${c.code} applied successfully` };
  },
  clearCoupon() { delete this.db._appliedCoupon; this.save(); this.emit(); },

  /* ---- wishlist ---- */
  wishlist() { return this.db.wishlist[this.cartKey()] || (this.db.wishlist[this.cartKey()] = []); },
  toggleWishlist(pid) {
    const w = this.wishlist();
    const i = w.indexOf(pid);
    if (i >= 0) { w.splice(i, 1); toast("Removed from wishlist", "pri"); }
    else { w.push(pid); toast("Saved to wishlist ♥", "ok"); }
    this.save(); this.emit();
  },
  inWishlist(pid) { return this.wishlist().includes(pid); },

  /* ---- checkout ---- */
  placeOrder(info) {
    const d = this.cartDetail();
    if (!d.items.length) return null;
    const order = {
      id: "NX-" + Math.floor(200000 + Math.random() * 799999),
      customerId: Session.user?.id || "guest",
      customerName: info.name, customerEmail: info.email,
      items: d.items.map((i) => ({ productId: i.productId, name: i.product.name, emoji: i.product.emoji, price: i.product.price, qty: i.qty, vendorId: i.product.vendorId, sku: i.product.sku })),
      subtotal: d.subtotal, shipping: d.shipping, tax: d.tax, discount: d.discount, total: d.total,
      status: "pending", paymentStatus: info.paymentMethod === "crypto" ? "pending" : "paid", createdAt: new Date().toISOString(),
      address: info.address, paymentMethod: info.paymentMethod, cryptoAsset: info.cryptoAsset || null, cryptoNetwork: info.cryptoNetwork || null,
      tracking: null, carrier: null,
      timeline: [{ s: "pending", label: "Order placed", at: new Date().toISOString() }],
    };
    this.db.orders.unshift(order);
    d.items.forEach((i) => { const p = this.product(i.productId); if (p) { p.stock = Math.max(0, p.stock - i.qty); p.sold += i.qty; } });
    const c = this.db.coupons.find((x) => x.code === this.db._appliedCoupon);
    if (c) c.uses++;
    this.clearCart(); this.clearCoupon();
    this.notify("New order received", `Order ${order.id} for ${money(order.total)}`, "order");
    this.save(); this.emit();
    return order;
  },

  /* ---- analytics helpers ---- */
  stats(vendorId = null) {
    const orders = vendorId ? this.ordersForVendor(vendorId) : this.db.orders;
    const products = vendorId ? this.products({ vendorId }) : this.db.products;
    const paid = orders.filter((o) => !["cancelled", "refunded"].includes(o.status));
    const rev = (o) => vendorId ? o.items.filter((i) => i.vendorId === vendorId).reduce((s, i) => s + i.price * i.qty, 0) : o.total;
    const revenue = paid.reduce((s, o) => s + rev(o), 0);
    const units = paid.reduce((s, o) => s + (vendorId ? o.items.filter((i) => i.vendorId === vendorId).reduce((a, i) => a + i.qty, 0) : o.items.reduce((a, i) => a + i.qty, 0)), 0);
    const now = Date.now(), DAY = 864e5;
    const period = (days) => {
      const cur = paid.filter((o) => now - new Date(o.createdAt) < days * DAY);
      const prev = paid.filter((o) => { const d = now - new Date(o.createdAt); return d >= days * DAY && d < 2 * days * DAY; });
      const cr = cur.reduce((s, o) => s + rev(o), 0), pr = prev.reduce((s, o) => s + rev(o), 0);
      return { current: cr, previous: pr, growth: pr ? +(((cr - pr) / pr) * 100).toFixed(1) : 100, orders: cur.length, prevOrders: prev.length };
    };
    return {
      revenue, units, orders: orders.length, products: products.length,
      aov: paid.length ? revenue / paid.length : 0,
      pending: orders.filter((o) => o.status === "pending").length,
      processing: orders.filter((o) => o.status === "processing").length,
      shipped: orders.filter((o) => o.status === "shipped").length,
      delivered: orders.filter((o) => o.status === "delivered").length,
      cancelled: orders.filter((o) => o.status === "cancelled").length,
      refunded: orders.filter((o) => o.status === "refunded").length,
      customers: new Set(orders.map((o) => o.customerId)).size,
      lowStock: products.filter((p) => p.stock > 0 && p.stock <= 25).length,
      outStock: products.filter((p) => p.stock === 0).length,
      p7: period(7), p30: period(30), p90: period(90),
      revenueSeries: this.series(vendorId, 30),
    };
  },
  series(vendorId, days = 30) {
    const paid = (vendorId ? this.ordersForVendor(vendorId) : this.db.orders).filter((o) => !["cancelled", "refunded"].includes(o.status));
    const rev = (o) => vendorId ? o.items.filter((i) => i.vendorId === vendorId).reduce((s, i) => s + i.price * i.qty, 0) : o.total;
    const out = [];
    for (let i = days - 1; i >= 0; i--) {
      const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - i);
      const end = new Date(start.getTime() + 864e5);
      const day = paid.filter((o) => { const t = new Date(o.createdAt); return t >= start && t < end; });
      const locale = typeof I18n !== "undefined" && I18n.lang === "ku" ? "ku" : typeof I18n !== "undefined" && I18n.lang === "ar" ? "ar" : "en-US";
      const kuMonths = ["Rêbendan", "Sibat", "Adar", "Nîsan", "Gulan", "Hezîran", "Tîrmeh", "Gelawêj", "Îlon", "Cotmeh", "Sermawez", "Berfanbar"];
      const label = locale === "ku" ? kuMonths[start.getMonth()] + " " + start.getDate() : start.toLocaleDateString(locale, { month: "short", day: "numeric" });
      out.push({ date: start.toISOString(), label, revenue: +day.reduce((s, o) => s + rev(o), 0).toFixed(2), orders: day.length });
    }
    return out;
  },
  topProducts(vendorId = null, n = 5) {
    const map = {};
    (vendorId ? this.ordersForVendor(vendorId) : this.db.orders).filter((o) => !["cancelled", "refunded"].includes(o.status)).forEach((o) => {
      o.items.filter((i) => !vendorId || i.vendorId === vendorId).forEach((i) => {
        map[i.productId] = map[i.productId] || { productId: i.productId, name: i.name, emoji: i.emoji, units: 0, revenue: 0 };
        map[i.productId].units += i.qty; map[i.productId].revenue += i.price * i.qty;
      });
    });
    return Object.values(map).sort((a, b) => b.revenue - a.revenue).slice(0, n);
  },
  categoryBreakdown(vendorId = null) {
    const out = {};
    this.products(vendorId ? { vendorId } : {}).forEach((p) => { out[p.category] = out[p.category] || { revenue: 0, units: 0, count: 0 }; out[p.category].count++; });
    (vendorId ? this.ordersForVendor(vendorId) : this.db.orders).filter((o) => !["cancelled", "refunded"].includes(o.status)).forEach((o) => {
      o.items.filter((i) => !vendorId || i.vendorId === vendorId).forEach((i) => {
        const p = this.product(i.productId); if (!p) return;
        out[p.category].revenue += i.price * i.qty; out[p.category].units += i.qty;
      });
    });
    return Object.entries(out).map(([k, v]) => ({ category: k, name: CATEGORIES.find((c) => c.id === k)?.name || k, icon: CATEGORIES.find((c) => c.id === k)?.icon || "📦", ...v })).sort((a, b) => b.revenue - a.revenue);
  },
};

/* ---------- Session / auth ---------- */
const Session = {
  user: null, vendor: null, role: null,
  load() {
    try { const raw = sessionStorage.getItem(SS_KEY) || localStorage.getItem(SS_KEY); if (raw) Object.assign(this, JSON.parse(raw)); } catch (e) {}
  },
  persist(remember) {
    const data = JSON.stringify({ user: this.user, vendor: this.vendor, role: this.role });
    sessionStorage.setItem(SS_KEY, data);
    if (remember) localStorage.setItem(SS_KEY, data); else localStorage.removeItem(SS_KEY);
  },
  login(email, password, asVendor, remember) {
    const e = email.trim().toLowerCase();
    const user = Store.db.users.find((u) => u.email.toLowerCase() === e && u.password === password);
    if (user) {
      if (user.status === "banned") return { ok: false, msg: "This account has been suspended." };
      this.user = { ...user }; this.role = user.role === "admin" ? "admin" : "customer";
      this.vendor = null; this.persist(remember); return { ok: true, role: this.role };
    }
    const vendor = Store.db.vendors.find((v) => v.email.toLowerCase() === e && v.password === password);
    if (vendor) {
      if (vendor.status === "suspended") return { ok: false, msg: "Your store has been suspended. Contact support." };
      if (vendor.status === "pending") return { ok: false, msg: "Your application is still under review." };
      this.vendor = { ...vendor }; this.role = "vendor"; this.user = null;
      this.persist(remember); return { ok: true, role: "vendor" };
    }
    return { ok: false, msg: "Invalid email or password. Try a demo account below." };
  },
  register(data, asVendor) {
    const e = data.email.trim().toLowerCase();
    if (Store.db.users.some((u) => u.email.toLowerCase() === e) || Store.db.vendors.some((v) => v.email.toLowerCase() === e))
      return { ok: false, msg: "An account with this email already exists." };
    if (asVendor) {
      const v = { id: uid("v"), name: data.storeName, email: data.email, password: data.password, logo: "🏪", rating: 0, reviews: 0, joined: new Date().toISOString().slice(0, 10), status: Store.db.settings.autoApproveVendors ? "active" : "pending", commission: Store.db.settings.commission, plan: "starter", country: data.country || "—", city: data.city || "—", verified: false, balance: 0, pending: 0, followers: 0, responseRate: 90, shipOnTime: 90, description: data.description || "", banner: "linear-gradient(135deg,#6d5efc,#00e5a0)" };
      Store.upsertVendor(v);
      Store.notify("Vendor application", `${data.storeName} submitted an application`, "vendor");
      this.vendor = v; this.role = "vendor"; this.user = null; this.persist(true);
      return { ok: true, role: "vendor", pending: v.status === "pending" };
    }
    const u = { id: uid("u"), name: data.name, email: data.email, password: data.password, role: "customer", avatar: "🙂", joined: new Date().toISOString().slice(0, 10), phone: "", address: data.address || "", status: "active" };
    Store.upsertUser(u);
    this.user = u; this.role = "customer"; this.vendor = null; this.persist(true);
    return { ok: true, role: "customer" };
  },
  logout() { this.user = null; this.vendor = null; this.role = null; sessionStorage.removeItem(SS_KEY); localStorage.removeItem(SS_KEY); },
};

</script>
<script>
/* ============ NEXUS UI — layout, header, footer, charts, components ============ */
function Logo(onclick, size = 1) {
  return h("div", { onclick, style: { display: "flex", alignItems: "center", gap: "10px", cursor: onclick ? "pointer" : "default" } },
    h("div", { style: { width: `${36 * size}px`, height: `${36 * size}px`, borderRadius: "11px", background: "linear-gradient(135deg,var(--pri),var(--acc))", display: "grid", placeItems: "center", fontWeight: "800", fontSize: `${19 * size}px`, color: "#fff", fontFamily: "Sora" } }, "◈"),
    h("div", { style: { lineHeight: "1.05" } },
      h("div", { style: { fontWeight: "800", fontSize: `${19 * size}px`, fontFamily: "Sora", letterSpacing: "-.03em" } }, "NEXUS"),
      h("div", { style: { fontSize: `${10 * size}px`, color: "var(--mut)", letterSpacing: ".16em", fontWeight: "600" } }, "MARKETPLACE")));
}

/* ---------- Header ---------- */
function Header() {
  if (document.body.classList.contains("public-theme")) return ArabicHeader();
  const nav = [
    { label: "Home", path: "/" },
    { label: "Shop", path: "/shop" },
    { label: "Categories", path: "/categories" },
    { label: "Sell on NEXUS", path: "/vendor/register" },
  ];
  const cur = Router.current.path;
  const cat = Store.cartCount();
  const unread = Store.db.notifications.filter((n) => !n.read).length;
  const [menuOpen, setMenuOpen] = [false, null];

  const searchInput = h("input", {
    placeholder: "Search 30+ products, brands, vendors…", style: { paddingLeft: "40px", background: "var(--panel2)" },
    value: Router.current.query.q || "",
    onkeydown: (e) => { if (e.key === "Enter") { Router.go("/shop?q=" + encodeURIComponent(e.target.value)); } },
  });
  const searchWrap = h("div", { style: { position: "relative", flex: "1", maxWidth: "480px" } },
    h("span", { style: { position: "absolute", left: "13px", top: "50%", transform: "translateY(-50%)", color: "var(--mut)", display: "flex" }, html: I.search }),
    searchInput);

  const userArea = () => {
    if (Session.role === "vendor") {
      return h("div", { style: { display: "flex", gap: "8px", alignItems: "center" } },
        h("button", { class: "btn btn-g btn-sm", onclick: () => Router.go("/vendor/dashboard") }, "Vendor Portal"),
        h("button", { class: "btn btn-g btn-sm", onclick: () => { Session.logout(); toast("Signed out", "pri"); Router.go("/"); App.render(); } , html: I.logout }));
    }
    if (Session.role === "admin") {
      return h("div", { style: { display: "flex", gap: "8px" } },
        h("button", { class: "btn btn-g btn-sm", onclick: () => Router.go("/admin/dashboard") }, "Admin"),
        h("button", { class: "btn btn-g btn-sm", onclick: () => { Session.logout(); Router.go("/"); App.render(); }, html: I.logout }));
    }
    if (Session.user) {
      return h("div", { style: { display: "flex", gap: "8px", alignItems: "center" } },
        NotifBell(unread),
        h("button", { class: "btn btn-g btn-sm", onclick: () => Router.go("/account") }, Session.user.name.split(" ")[0]),
        h("button", { class: "btn btn-g btn-sm", onclick: () => { Session.logout(); toast("Signed out", "pri"); Router.go("/"); App.render(); }, html: I.logout }));
    }
    return h("div", { style: { display: "flex", gap: "8px" } },
      h("button", { class: "btn btn-g btn-sm", onclick: () => Router.go("/login") }, "Sign in"),
      h("button", { class: "btn btn-p btn-sm", onclick: () => Router.go("/vendor/register") }, "Start selling"));
  };

  return h("header", { class: "fade-in", style: { position: "sticky", top: 0, zIndex: 100, background: "color-mix(in srgb, var(--bg) 88%, transparent)", backdropFilter: "blur(14px)", borderBottom: "1px solid var(--line)" } },
    h("div", { style: { display: "flex", alignItems: "center", gap: "20px", padding: "13px 22px", maxWidth: "1560px", margin: "0 auto" } },
      Logo(() => Router.go("/")),
      h("nav", { class: "hide-m", style: { display: "flex", gap: "4px" } },
        nav.map((n) => h("a", { href: "#" + n.path, style: { padding: "8px 13px", borderRadius: "9px", fontSize: "14px", fontWeight: "500", color: cur === n.path ? "var(--txt)" : "var(--mut)", background: cur === n.path ? "var(--panel2)" : "none" } }, n.label))),
      h("div", { class: "hide-m", style: { flex: "1", display: "flex", justifyContent: "center" } }, searchWrap),
      h("div", { style: { marginLeft: "auto", display: "flex", alignItems: "center", gap: "8px" } },
        ThemeToggle(),
        h("button", { class: "btn btn-g btn-sm", style: { position: "relative" }, onclick: () => Router.go("/cart") }, I.cart, cat > 0 ? h("span", { style: { position: "absolute", top: "-6px", right: "-6px", background: "var(--pri)", color: "#fff", borderRadius: "99px", fontSize: "10px", padding: "2px 6px", fontWeight: "700" } }, cat) : null),
        userArea())));
}

function NotifBell(unread) {
  return h("button", { class: "btn btn-g btn-sm", style: { position: "relative" }, onclick: () => {
    const list = Store.db.notifications;
    const m = modal("Notifications",
      list.length ? h("div", { style: { display: "flex", flexDirection: "column", gap: "10px" } }, list.map((n) =>
        h("div", { style: { padding: "13px", borderRadius: "11px", background: n.read ? "transparent" : "var(--panel2)", border: "1px solid var(--line)", display: "flex", gap: "12px" } },
          h("div", { style: { fontSize: "20px" } }, n.type === "order" ? "📦" : n.type === "payout" ? "💰" : n.type === "stock" ? "⚠️" : "⭐"),
          h("div", { style: { flex: 1 } },
            h("div", { style: { fontWeight: "600", fontSize: "14px" } }, n.title),
            h("div", { style: { color: "var(--mut)", fontSize: "13px", marginTop: "2px" } }, n.body),
            h("div", { style: { color: "var(--mut)", fontSize: "11px", marginTop: "5px" } }, dt(n.at, "ago")))))) :
        h("p", { style: { color: "var(--mut)" } }, "No notifications"),
      { footer: [h("button", { class: "btn btn-g", onclick: () => { Store.db.notifications.forEach((n) => (n.read = true)); Store.save(); Store.emit(); m.close(); } }, "Mark all read")] });
  } }, I.bell, unread > 0 ? h("span", { style: { position: "absolute", top: "-6px", right: "-6px", background: "var(--bad)", color: "#fff", borderRadius: "99px", fontSize: "10px", padding: "2px 6px", fontWeight: "700" } }, unread) : null);
}

function ThemeToggle() {
  const isDark = Store.db.settings.theme !== "light";
  return h("button", {
    class: "btn btn-g btn-sm", title: "Toggle theme",
    onclick: () => { Store.db.settings.theme = isDark ? "light" : "dark"; Store.save(); applyTheme(); Store.emit(); },
  }, isDark ? "🌙" : "☀️");
}
function applyTheme() { document.documentElement.dataset.theme = Store.db.settings.theme === "light" ? "light" : "dark"; }

function EnglishFooter() {
  const cols = [
    ["Marketplace", [["All Products", "/shop"], ["Categories", "/categories"], ["Deals", "/shop?sort=discount"], ["Top Vendors", "/vendors"]]],
    ["Sell", [["Become a Vendor", "/vendor/register"], ["Vendor Login", "/vendor/login"], ["Fee Structure", "/pricing"], ["Seller Guide", "/guide"]]],
    ["Support", [["Help Center", "/help"], ["Track Order", "/track"], ["Returns", "/returns"], ["Contact", "/contact"]]],
    ["Company", [["About", "/about"], ["Careers", "/careers"], ["Privacy", "/privacy"], ["Terms", "/terms"]]],
  ];
  return h("footer", { style: { borderTop: "1px solid var(--line)", marginTop: "70px", background: "var(--bg2)" } },
    h("div", { style: { maxWidth: "1560px", margin: "0 auto", padding: "50px 22px 26px", display: "grid", gridTemplateColumns: "1.6fr repeat(4, 1fr)", gap: "34px" } },
